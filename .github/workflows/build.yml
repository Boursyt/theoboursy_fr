name: build

# Callable by the orchestrator (main.yml) or runnable on its own.
on:
  workflow_call:
  workflow_dispatch:

# Required for Workload Identity Federation (OIDC) — no long-lived keys.
permissions:
  contents: read
  id-token: write

env:
  REGION: ${{ vars.REGION }}
  PROJECT_ID: ${{ vars.PROJECT_ID }}
  AR_REPO: ${{ vars.AR_REPO }} # Artifact Registry repository name

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: www
            image: theoboursy-www
          - site: img2ascii
            image: theoboursy-ascii

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Authenticate to Google Cloud (OIDC)
        id: auth
        uses: google-github-actions/auth@v3.0.0
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3.0.1

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            SITE=${{ matrix.site }}
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
