<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="404, page not found." />
    <title>404, theoboursy.fr monitoring</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;0,800;1,400&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/styles.css" />
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var stored = localStorage.getItem("theme");
          if (stored === "dark" || (!stored && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches)) {
            root.setAttribute("data-theme", "dark");
          }
        } catch (e) {}
        document.addEventListener("DOMContentLoaded", function () {
          var btn = document.querySelector(".theme-toggle");
          if (!btn) return;
          btn.addEventListener("click", function () {
            var isDark = root.getAttribute("data-theme") === "dark";
            if (isDark) { root.removeAttribute("data-theme"); } else { root.setAttribute("data-theme", "dark"); }
            try { localStorage.setItem("theme", isDark ? "light" : "dark"); } catch (e) {}
          });
        });
      })();
    </script>
  </head>
  <body>
    <div class="shell-grid" aria-hidden="true"></div>

    <header class="topbar">
      <div class="topbar-inner">
        <span class="brand"><span class="brand-prompt">~/theoboursy.fr/monitoring</span> <span class="cursor">█</span></span>
        <nav class="topnav" aria-label="Primary navigation">
          <a href="https://www.theoboursy.fr">home</a>
          <a href="https://github.com/Boursyt/infra-monitoring">github</a>
          <button class="theme-toggle" type="button" aria-label="Toggle color theme" title="Toggle theme">
            <span class="icon-dark" aria-hidden="true">☾</span>
            <span class="icon-light" aria-hidden="true">☀</span>
          </button>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero" aria-labelledby="title">
        <p class="eyebrow"><span class="dot"></span>HTTP 404, Not Found</p>
        <h1 id="title">404</h1>
        <p class="lead">
          No resource maps to that path (or it moved). Check the URL, or head
          back home.
        </p>
        <div class="actions">
          <a class="button" href="/">Back to monitoring</a>
        </div>
      </section>
    </main>

    <footer class="statusbar" aria-hidden="true">
      <span class="seg branch"><span class="git">⎇</span> main</span>
      <span class="seg">UTF-8</span>
      <span class="seg">LF</span>
      <span class="seg right">© Théo Boursy</span>
    </footer>

</html>
