<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="404, page not found." />
    <title>404, theoboursy.fr monitoring</title>
    <link rel="stylesheet" href="assets/styles.css" />
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var stored = localStorage.getItem("theme");
          if (stored === "dark" || (!stored && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches)) {
            root.setAttribute("data-theme", "dark");
          }
        } catch (e) {}
        document.addEventListener("DOMContentLoaded", function () {
          var toggle = document.querySelector(".theme-toggle");
          if (toggle) {
            toggle.addEventListener("click", function () {
              var isDark = root.getAttribute("data-theme") === "dark";
              if (isDark) { root.removeAttribute("data-theme"); } else { root.setAttribute("data-theme", "dark"); }
              try { localStorage.setItem("theme", isDark ? "light" : "dark"); } catch (e) {}
            });
          }
          var burger = document.querySelector(".nav-burger");
          var nav = document.querySelector(".topnav");
          if (burger && nav) {
            var setOpen = function (open) {
              nav.classList.toggle("open", open);
              burger.classList.toggle("open", open);
              burger.setAttribute("aria-expanded", open ? "true" : "false");
            };
            burger.addEventListener("click", function (e) {
              e.stopPropagation();
              setOpen(!nav.classList.contains("open"));
            });
            nav.addEventListener("click", function (e) {
              if (e.target.tagName === "A") setOpen(false);
            });
            document.addEventListener("click", function (e) {
              if (nav.classList.contains("open") && !nav.contains(e.target) && !burger.contains(e.target)) setOpen(false);
            });
          }
        });
      })();
    </script>
  </head>
  <body class="site-app">
    <div class="shell-grid" aria-hidden="true"></div>

    <header class="topbar">
      <div class="topbar-inner">
        <span class="brand"><span class="brand-prompt">~/theoboursy.fr/monitoring</span> <span class="cursor">█</span></span>
        <button class="nav-burger" type="button" aria-label="Menu" aria-expanded="false">
          <span class="ico-open" aria-hidden="true">☰</span>
          <span class="ico-close" aria-hidden="true">✕</span>
        </button>
        <nav class="topnav" aria-label="Primary navigation">
          <a href="https://www.theoboursy.fr">home</a>
          <a href="https://github.com/Boursyt/infra-monitoring">github</a>
          <button class="theme-toggle" type="button" aria-label="Toggle color theme" title="Toggle theme">
            <span class="icon-dark" aria-hidden="true">☾</span>
            <span class="icon-light" aria-hidden="true">☀</span>
          </button>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero" aria-labelledby="title">
        <p class="eyebrow"><span class="dot"></span>HTTP 404, Not Found</p>
        <h1 id="title">404</h1>
        <p class="lead">
          No resource maps to that path (or it moved). Check the URL, or head
          back home.
        </p>
        <div class="actions">
          <a class="button" href="/">Back to monitoring</a>
        </div>
      </section>
    </main>

    <footer class="statusbar">
      <span class="seg branch" aria-hidden="true"><span class="git">⎇</span> main</span>
      <span class="seg" aria-hidden="true">UTF-8</span>
      <span class="seg" aria-hidden="true">LF</span>
      <a class="seg" href="/legal.html">legal</a>
      <span class="seg right" aria-hidden="true">© Théo Boursy</span>
    </footer>
  </body>
</html>
